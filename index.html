<!DOCTYPE html>
<html lang=\"en\">
<head>
  <meta charset=\"UTF-8\" />
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />
  <title>Trump Letter to Biden - Concept 5</title>
  <link rel=\"stylesheet\" href=\"styles.css\" />
  <script defer src=\"script.js\"></script>
</head>
<body>
  <header class=\"site-header\"><h1>Keyboard Friendly Editor</h1></header>
  <main class=\"container\">
    <section class=\"panel\" aria-label=\"Editor\">
      <h2>Editor</h2>
      <input id=\"titleInput\" placeholder=\"Subject...\" style=\"width:100%;padding:8px;border-radius:6px;border:1px solid #ddd;\"/>
      <textarea id=\"textArea\" placeholder=\"Type your message here...\"></textarea>
      <div>
        <button id=\"clear\">Clear</button>
        <button id=\"show\">Show</button>
      </div>
    </section>
    <section class=\"panel\" aria-label=\"Preview\">
      <h2>Preview</h2>
      <div id=\"out\" class=\"preview-box\"></div>
    </section>
  </main>
</body>
</html>
